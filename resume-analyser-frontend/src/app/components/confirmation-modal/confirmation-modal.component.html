@if (isOpen) {
  <!-- Backdrop -->
  <div
    class="fixed inset-0 bg-hirivo-ink/60 z-50 flex items-center justify-center p-4"
    (click)="onCancel()">

    <!-- Panel -->
    <div
      class="bg-white rounded-xl shadow-xl max-w-sm w-full p-6"
      (click)="$event.stopPropagation()">

      <!-- Icon -->
      <div class="w-12 h-12 rounded-full bg-hirivo-red-bg flex items-center justify-center mx-auto mb-4">
        <svg class="w-6 h-6 text-hirivo-red" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
        </svg>
      </div>

      <!-- Title -->
      <h3 class="text-base font-semibold text-hirivo-ink text-center mb-2">{{ title }}</h3>

      <!-- Message -->
      <p class="text-sm text-hirivo-muted text-center mb-6 leading-relaxed">{{ message }}</p>

      <!-- Buttons -->
      <div class="flex gap-3">
        <button
          (click)="onCancel()"
          class="flex-1 py-2.5 border border-hirivo-border rounded-lg text-sm font-medium text-hirivo-text hover:bg-hirivo-surface transition">
          {{ cancelText }}
        </button>
        <button
          (click)="onConfirm()"
          [class]="confirmButtonClass"
          class="flex-1 py-2.5 rounded-lg text-sm font-semibold text-white transition">
          {{ confirmText }}
        </button>
      </div>

    </div>
  </div>
}
